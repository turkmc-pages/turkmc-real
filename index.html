<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TURKMC - Türk Minecraft Sunucuları</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#eee;background:#111;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#111 0%,#1b1405 55%,#090909 100%);z-index:-2}
.wrap{width:min(1100px,94%);margin:0 auto;padding:40px 0}
.card{background:rgba(20,20,20,.94);border:1px solid #8f6a20;border-radius:16px;padding:24px;box-shadow:0 10px 35px #0008;margin-bottom:20px}
h1,h2{color:#f5c542;margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;background:#111;color:#fff;border:1px solid #555;border-radius:8px;font-family:inherit}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#d9a927;color:#111;margin:4px 4px 4px 0}
button.gray{background:#444;color:#fff}
.hidden{display:none}
.msg{padding:12px;border-radius:8px;margin:10px 0}.err{background:#481c1c}.ok{background:#173c22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.server{border:1px solid #444;border-radius:12px;padding:16px;background:#181818}
.small{color:#aaa;font-size:13px}
.tag{display:inline-block;border:1px solid #8f6a20;border-radius:20px;padding:4px 9px;color:#f5c542;font-size:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
a{color:#f5c542}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:#181818;border:1px solid #444;color:#ccc;font-weight:400;padding:8px 14px;border-radius:20px;margin:0;cursor:pointer}
.tab.active{background:#d9a927;color:#111;border-color:#d9a927;font-weight:700}
.ip-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.ip-row code{background:#111;border:1px solid #444;border-radius:6px;padding:6px 10px;flex:1;overflow-x:auto;white-space:nowrap;font-size:13px}
.ip-row button{margin:0;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <div>
      <h1 style="margin:0">⛏️ TURKMC</h1>
      <span class="small">Türk Minecraft sunucularını keşfet, kendi sunucunu / klanını paylaş.</span>
    </div>
    <button onclick="toggleForm()">+ Sunucu Ekle</button>
  </div>

  <div id="formCard" class="card hidden">
    <h2>Sunucu Başvurusu</h2>
    <div id="formMsg"></div>
    <input id="fName" placeholder="Sunucu / klan adı">
    <input id="fIp" placeholder="IP (örn: play.sunucu.com)">
    <select id="fType"></select>
    <input id="fWebsite" placeholder="Discord / Web sitesi (opsiyonel)">
    <textarea id="fDesc" placeholder="Açıklama"></textarea>
    <button onclick="submitServer()">Gönder</button>
    <p class="small">Başvurun admin onayından sonra listede yayınlanır.</p>
  </div>

  <div class="card">
    <div id="tabs" class="tabs"></div>
  </div>

  <div id="servers" class="grid"><p class="small">Yükleniyor...</p></div>
</div>

<script>
const TYPES=["Survival","SkyBlock","Factions","Towny","TrapPvP","PvP","BedWars","Pixelmon","Klan","Tier List","Diğer"];
let ALL=[];
let activeType="Tümü";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toggleForm(){
  document.getElementById("formCard").classList.toggle("hidden");
}

function renderTabs(){
  const tabs=["Tümü",...TYPES];
  document.getElementById("tabs").innerHTML=tabs.map(t=>
    `<button class="tab ${t===activeType?'active':''}" onclick="setType('${esc(t)}')">${esc(t)}</button>`
  ).join("");
}

function setType(t){
  activeType=t;
  renderTabs();
  renderServers();
}

function renderServers(){
  const list=activeType==="Tümü"?ALL:ALL.filter(s=>s.type===activeType);
  const box=document.getElementById("servers");

  if(!list.length){
    box.innerHTML="<p class='small'>Bu kategoride henüz sunucu yok.</p>";
    return;
  }

  box.innerHTML=list.map(s=>`
    <div class="server">
      <div class="tag">${esc(s.type)}</div>
      <h3 style="margin:6px 0">${esc(s.name)}</h3>
      <div class="ip-row">
        <code>${esc(s.ip)}</code>
        <button class="gray" onclick="copyIp('${esc(s.ip)}',this)">Kopyala</button>
      </div>
      <p>${esc(s.description||"")}</p>
      ${s.website?`<div><a href="${esc(s.website)}" target="_blank" rel="noopener">Discord / Web sitesi</a></div>`:""}
    </div>`).join("");
}

function copyIp(ip,btn){
  navigator.clipboard.writeText(ip).then(()=>{
    const old=btn.textContent;
    btn.textContent="Kopyalandı!";
    setTimeout(()=>btn.textContent=old,1500);
  }).catch(()=>{});
}

async function loadServers(){
  try{
    const r=await fetch("/api/servers");
    ALL=await r.json();
  }catch(err){
    ALL=[];
  }
  renderServers();
}

function fillTypeSelect(){
  document.getElementById("fType").innerHTML=TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
}

async function submitServer(){
  const name=document.getElementById("fName").value.trim();
  const ip=document.getElementById("fIp").value.trim();
  const type=document.getElementById("fType").value;
  const website=document.getElementById("fWebsite").value.trim();
  const description=document.getElementById("fDesc").value.trim();
  const box=document.getElementById("formMsg");

  box.innerHTML="";

  if(!name||!ip){
    box.innerHTML='<div class="msg err">Sunucu adı ve IP zorunludur.</div>';
    return;
  }

  try{
    const r=await fetch("/api/servers",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({name,ip,type,website,description})
    });

    const data=await r.json().catch(()=>({}));

    if(!r.ok){
      box.innerHTML='<div class="msg err">'+esc(data.error||"Başvuru gönderilemedi.")+'</div>';
      return;
    }

    box.innerHTML='<div class="msg ok">'+esc(data.message||"Başvurun alındı.")+'</div>';
    document.getElementById("fName").value="";
    document.getElementById("fIp").value="";
    document.getElementById("fWebsite").value="";
    document.getElementById("fDesc").value="";
  }catch(err){
    box.innerHTML='<div class="msg err">Bağlantı hatası, tekrar dene.</div>';
  }
}

renderTabs();
fillTypeSelect();
loadServers();
</script>
</body>
</html>
